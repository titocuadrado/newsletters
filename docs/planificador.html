<title>Planificador de Newsletters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,300&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<div id="app"></div>
<script>
const CSS = "/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   GARC\u00cdA DE POU \u2014 Brand stylesheet\n   Hoja base de marca. Copiar tal cual al proyecto y construir encima.\n   Origen: styles.css del redise\u00f1o (Multiplica). No editar los tokens.\n\n   Requiere en el <head>:\n   <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n   <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n   <link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,300&family=Caveat:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n   \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n\n/* \u2500\u2500 RESET \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n[hidden] { display: none !important; }\nhtml { font-size: 16px; overflow-x: clip; scroll-behavior: smooth; }\n@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }\nbody {\n  font-family: 'DM Sans', system-ui, sans-serif;\n  font-size: 16px;\n  line-height: 1.2;\n  background: var(--white);\n  color: var(--black);\n  overflow-x: clip;\n}\nimg { display: block; width: 100%; height: 100%; object-fit: cover; }\na { color: inherit; text-decoration: none; cursor: pointer; }\nul { list-style: none; }\nbutton { cursor: pointer; border: none; background: none; font-family: inherit; }\n\n/* \u2500\u2500 TOKENS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n:root {\n  /* Neutros */\n  --black:  #0A0A0A;\n  --white:  #FFFFFF;\n  --g50:    #F5F5F5;   /* fondo de secci\u00f3n puntual / zebra */\n  --g100:   #EEEEEE;   /* bordes DECORATIVOS: cards, divisores, paneles */\n  --g300:   #C4C4C4;\n  --g400:   #909090;   /* bordes de CONTROL interactivo \u2014 WCAG 1.4.11 \u22483.2:1 */\n  --g500:   #6E6E6E;   /* texto secundario, labels, eyebrows (AA sobre blanco) */\n  --g600:   #555555;   /* texto enf\u00e1tico secundario */\n  --g700:   #3D3D3D;   /* banners, barras de anuncio */\n\n  /* Marca */\n  --blue:      #002D72;   /* azul corporativo GDP \u2014 SOLO acci\u00f3n */\n  --blue-80:   #1A4490;   /* hover de bot\u00f3n azul */\n  --blue-60:   #2C5BA8;   /* hover sobre fondo azul */\n  --blue-10:   #EBF0F8;   /* fondo suave / estado activo */\n  --white-15:  #ffffff26; /* separadores sobre fondo azul */\n  --yellow:    #FFD100;   /* SOLO ofertas/badges/acentos de marketing */\n  --terracota: #8B3A2A;   /* destacados c\u00e1lidos: banners, campa\u00f1as */\n\n  /* Feedback / estado \u2014 nunca como color principal de UI */\n  --green:       #C5E63D;\n  --green-dark:  #2F4A05;\n  --yellow-dark: #7A5C00;\n  --red:         #A21C1C;\n  --red-10:      #FDECEC;\n  --red-accent:  #EE333E;\n  --red-promo:   #D42B2B;\n  --green-eco:      #2D7A4F;   /* pilar eco / sostenibilidad */\n  --green-eco-dark: #1F5A38;\n\n  /* Pills de estado \u2014 fondo s\u00f3lido claro + texto oscuro (AA \u2265 4.5) */\n  --pill-success-bg: #E3F3E8;  --pill-success-fg: #15683A;\n  --pill-warn-bg:    #FBEBCF;  --pill-warn-fg:    #8A5800;\n  --pill-info-bg:    #E3ECFB;  --pill-info-fg:    #1A4490;\n  --pill-neutral-bg: #ECEEF1;  --pill-neutral-fg: #44494F;\n\n  /* Layout */\n  --container:   100%;\n  --gap:         clamp(24px, 4vw, 64px);\n  --grid-cols:   24;\n  --grid-gutter: var(--sp-16);\n  --radius:      8px;\n\n  /* Alturas de control \u2014 usar SIEMPRE estos tokens */\n  --ctrl-h-xs: 26px;\n  --ctrl-h-sm: 32px;\n  --ctrl-h:    44px;   /* est\u00e1ndar: bot\u00f3n default, qty, add-to-cart */\n  --ctrl-h-lg: 48px;\n\n  /* Escala tipogr\u00e1fica */\n  --fs-2xs:  10px;   /* badges, c\u00f3digos, contadores */\n  --fs-3xs:  12px;   /* nav, breadcrumbs, micro-labels */\n  --fs-xs:   14px;   /* labels, eyebrows, botones */\n  --fs-sm:   16px;\n  --fs-base: 14px;   /* cuerpo secundario */\n  --fs-md:   16px;   /* cuerpo, botones LG */\n  --fs-lg:   16px;   /* cuerpo principal */\n  --fs-xl:   18px;   /* subheadings */\n  --fs-2xl:  20px;   /* precios, headings */\n  --fs-3xl:  24px;   /* Caveat decorativo */\n  --fs-4xl:  32px;   /* t\u00edtulos de secci\u00f3n */\n\n  /* Espaciado \u2014 8-point grid. NUNCA px literales en padding/margin/gap. */\n  --sp-4:  4px;\n  --sp-8:  8px;\n  --sp-12: 12px;\n  --sp-16: 16px;\n  --sp-20: 20px;\n  --sp-24: 24px;\n  --sp-32: 32px;\n  --sp-40: 40px;\n  --sp-48: 48px;\n  --sp-64: 64px;\n  --sp-80: 80px;\n  --sp-96: 96px;\n}\n\n/* \u2500\u2500 LAYOUT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.wrap { max-width: var(--container); margin-inline: auto; padding-inline: var(--gap); }\n\n/* Grid de 24 columnas, gutter 16px */\n.row { display: flex; flex-wrap: wrap; margin-inline: calc(var(--grid-gutter) / -2); }\n.row > [class*=\"col-\"] { padding-inline: calc(var(--grid-gutter) / 2); }\n[class*=\"col-\"] { flex: 0 0 auto; width: 100%; }\n@media (min-width: 1100px) {\n  .col-lg-1  { width: calc(100% / 24 * 1);  } .col-lg-2  { width: calc(100% / 24 * 2);  }\n  .col-lg-3  { width: calc(100% / 24 * 3);  } .col-lg-4  { width: calc(100% / 24 * 4);  }\n  .col-lg-5  { width: calc(100% / 24 * 5);  } .col-lg-6  { width: calc(100% / 24 * 6);  }\n  .col-lg-7  { width: calc(100% / 24 * 7);  } .col-lg-8  { width: calc(100% / 24 * 8);  }\n  .col-lg-9  { width: calc(100% / 24 * 9);  } .col-lg-10 { width: calc(100% / 24 * 10); }\n  .col-lg-11 { width: calc(100% / 24 * 11); } .col-lg-12 { width: calc(100% / 24 * 12); }\n  .col-lg-14 { width: calc(100% / 24 * 14); } .col-lg-15 { width: calc(100% / 24 * 15); }\n  .col-lg-16 { width: calc(100% / 24 * 16); } .col-lg-18 { width: calc(100% / 24 * 18); }\n  .col-lg-20 { width: calc(100% / 24 * 20); } .col-lg-24 { width: 100%; }\n}\n\n/* \u2500\u2500 TIPOGRAF\u00cdA \u2014 taxonom\u00eda cerrada, no inventar combinaciones \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.t-hero {\n  font-size: clamp(44px, 6vw, 96px); font-weight: 900; line-height: .95;\n  letter-spacing: -.04em; text-transform: uppercase;\n}\n.t-number {\n  font-size: clamp(40px, 7vw, 100px); font-weight: 900; line-height: 1;\n  letter-spacing: -.05em; color: #949494;\n}\n.section-title, .t-h1 {\n  font-size: clamp(22px, 2.5vw, 36px); font-weight: 900; line-height: 1.05;\n  letter-spacing: -.04em; text-transform: uppercase; color: var(--black);\n}\n.t-h2 { font-size: clamp(18px, 2vw, 24px); font-weight: 900; line-height: 1.1; letter-spacing: -.03em; }\n.t-h3 { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; letter-spacing: -.02em; }\n.t-subtitle {\n  font-size: var(--fs-md); font-weight: 700; line-height: 1.2;\n  letter-spacing: .08em; text-transform: uppercase;\n}\n/* Eyebrow \u2014 firma visual: toda cabecera de secci\u00f3n lleva eyebrow + section-title */\n.label, .t-eyebrow {\n  font-size: var(--fs-xs); font-weight: 600; line-height: 1.2;\n  letter-spacing: .14em; text-transform: uppercase; color: var(--g500);\n}\n.t-label-block {\n  font-size: var(--fs-xs); font-weight: 700; line-height: 1.2;\n  letter-spacing: .14em; text-transform: uppercase; color: var(--black);\n}\n.t-nav { font-size: var(--fs-3xs); font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }\n.t-micro { font-size: var(--fs-3xs); font-weight: 600; line-height: 1.3; }\n.t-body    { font-size: var(--fs-md);   font-weight: 400; line-height: 1.5; }\n.t-body-sm { font-size: var(--fs-base); font-weight: 400; line-height: 1.5; }\n.t-body-medium   { font-size: var(--fs-md); font-weight: 500; line-height: 1.4; }\n.t-body-semibold { font-size: var(--fs-md); font-weight: 600; line-height: 1.4; }\n.t-script { font-family: 'Caveat', cursive; font-weight: 500; line-height: 1; letter-spacing: -.01em; }\n\n.section-header {\n  display: flex; align-items: flex-end; justify-content: space-between;\n  margin-bottom: var(--sp-48);\n}\n@media (max-width: 720px) {\n  .section-header { flex-direction: column; align-items: center; text-align: center; gap: var(--sp-16); }\n}\n\n/* \u2500\u2500 BOTONES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--sp-8);\n  height: var(--ctrl-h); padding: 0 28px;\n  font-family: inherit; font-size: var(--fs-xs); font-weight: 500;\n  letter-spacing: .07em; text-transform: uppercase; white-space: nowrap;\n  border-radius: var(--radius);\n  transition: background .2s, color .2s, border-color .2s;\n}\n.btn svg { flex-shrink: 0; }\n.btn-sm { height: var(--ctrl-h-sm); padding: 0 var(--sp-16); font-size: var(--fs-3xs); gap: 6px; }\n.btn-lg { height: 56px; padding: 0 var(--sp-48); font-size: var(--fs-md); gap: var(--sp-8); letter-spacing: .06em; }\n.btn.btn-icon-only { padding: 0; width: var(--ctrl-h); aspect-ratio: 1; }\n.btn.btn-sm.btn-icon-only { width: var(--ctrl-h-sm); }\n\n.btn-blue         { background: var(--blue); color: var(--white); }\n.btn-blue:hover   { background: var(--blue-80); }\n.btn-outline-blue       { border: 1.5px solid var(--blue); color: var(--blue); }\n.btn-outline-blue:hover { background: var(--blue); color: var(--white); }\n/* Yellow \u2014 uso muy comedido: marketing/ofertas puntuales */\n.btn-yellow       { background: var(--yellow); color: var(--blue); }\n.btn-yellow:hover { background: var(--white); color: var(--blue); }\n/* White / Outline-White \u2014 SOLO sobre fondo oscuro o foto */\n.btn-white        { background: var(--white); color: var(--blue); }\n.btn-white:hover  { background: var(--blue-80); color: var(--white); }\n.btn-outline-white       { border: 1.5px solid rgba(255,255,255,.7); color: var(--white); }\n.btn-outline-white:hover { background: var(--white); border-color: var(--white); color: var(--blue); }\n\n.btn:disabled, .btn[aria-disabled=\"true\"] { opacity: .35; cursor: not-allowed; pointer-events: none; }\n\n/* Iconos <img> dentro de bot\u00f3n */\n.btn-ico { width: 16px; height: 16px; object-fit: contain; }\n.btn-blue .btn-ico { filter: brightness(0) invert(1); }\n.btn-outline-blue:hover .btn-ico { filter: brightness(0) invert(1); }\n\n/* \u2500\u2500 ICONO CLICABLE EN TABLA \u2014 norma del sistema, no recrear \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.table-icon-btn {\n  background: transparent; border: none; cursor: pointer; color: var(--blue);\n  width: 32px; height: 32px; border-radius: 50%;\n  display: inline-flex; align-items: center; justify-content: center;\n  transition: background .2s, color .2s; flex-shrink: 0;\n}\n.table-icon-btn:hover { background: var(--blue); color: var(--white); }\n.tib-ico { width: 18px; height: 18px; object-fit: contain; }\n.table-icon-btn:hover .tib-ico { filter: brightness(0) invert(1); }\n\n/* Chevron compartido \u2014 <img> a icons/chevron-*.svg (carga en file:// sin servidor) */\n.gdp-chevron { width: 1em; height: 1em; flex-shrink: 0; object-fit: contain; vertical-align: middle; }\n\n/* \u2500\u2500 CARDS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-card {\n  background: var(--white);\n  display: flex; flex-direction: column; height: 100%;\n  position: relative;\n  border: 1px solid var(--g100);      /* borde decorativo */\n  border-radius: var(--radius);\n  transition: box-shadow .25s;\n}\n/* REGLA: el hover de card es SOMBRA. Nunca cambiar el color del borde. */\n.gdp-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,.07); }\n.gdp-card-img { aspect-ratio: 3/4; overflow: hidden; background: var(--g50); position: relative; }\n.gdp-card-img img { transition: transform .6s cubic-bezier(.16,1,.3,1); }\n.gdp-card:hover .gdp-card-img img { transform: scale(1.05); }\n.gdp-card-body { padding: var(--sp-16); display: flex; flex-direction: column; gap: var(--sp-8); flex: 1; }\n\n/* \u2500\u2500 FORMULARIOS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-field { position: relative; display: flex; flex-direction: column; }\n.gdp-field > span {                    /* label flotante sobre el input */\n  position: absolute; top: var(--sp-8); left: var(--sp-16); z-index: 1;\n  color: var(--g500); font-size: var(--fs-3xs); font-weight: 600;\n}\n.gdp-field input,\n.gdp-field select,\n.gdp-field textarea {\n  width: 100%; height: 56px;\n  border: 1px solid var(--g400);       /* borde de control \u2014 AA 1.4.11 */\n  border-radius: var(--radius);\n  background: var(--g50); color: var(--black);\n  font: inherit; font-size: var(--fs-md);\n  padding: var(--sp-20) var(--sp-16) var(--sp-8);\n  outline: none;\n  transition: border-color .2s, background .2s;\n}\n.gdp-field textarea { height: auto; min-height: 72px; resize: none; padding-top: var(--sp-32); }\n.gdp-field input:focus,\n.gdp-field select:focus,\n.gdp-field textarea:focus { border-color: var(--blue); background: var(--white); }\n.gdp-field.is-error input,\n.gdp-field.is-error select,\n.gdp-field.is-error textarea { border-color: var(--red); background: var(--red-10); }\n.gdp-field-error { margin-top: var(--sp-8); color: var(--red); font-size: var(--fs-sm); line-height: 1.35; }\n.gdp-field-hint  { font-size: var(--fs-3xs); color: var(--g500); margin-top: var(--sp-4); }\n.gdp-field-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-16); }\n.gdp-field--full { grid-column: 1 / -1; }\n@media (max-width: 720px) { .gdp-field-grid { grid-template-columns: 1fr; } }\n\n/* \u2500\u2500 ALERTAS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-alert {\n  display: flex; align-items: stretch; gap: 0;\n  border: 1px solid; border-radius: var(--radius);\n  background: var(--white); overflow: hidden; text-align: left;\n}\n.gdp-alert-icon {\n  flex-shrink: 0; width: 54px;\n  display: flex; align-items: center; justify-content: center;\n  color: var(--white);\n}\n.gdp-alert-icon svg { width: 22px; height: 22px; }\n.gdp-alert-content { flex: 1; min-width: 0; padding: var(--sp-12) var(--sp-16) var(--sp-12) var(--sp-12); }\n.gdp-alert-title {\n  display: block; font-size: var(--fs-base); font-weight: 700;\n  letter-spacing: -.02em; color: var(--black); margin-bottom: var(--sp-4); line-height: 1.3;\n}\n.gdp-alert-msg { margin: 0; font-size: var(--fs-base); font-weight: 400; color: var(--g500); }\n\n.gdp-alert--success { border-color: var(--green); }\n.gdp-alert--success .gdp-alert-icon { background: var(--green); color: var(--green-dark); }\n.gdp-alert--warning { border-color: var(--yellow); }\n.gdp-alert--warning .gdp-alert-icon { background: var(--yellow); color: var(--yellow-dark); }\n.gdp-alert--info    { border-color: var(--blue); }\n.gdp-alert--info .gdp-alert-icon    { background: var(--blue); }\n.gdp-alert--error   { border-color: var(--red); }\n.gdp-alert--error .gdp-alert-icon   { background: var(--red); }\n.gdp-alert--neutral { border-color: var(--g300); }\n.gdp-alert--neutral .gdp-alert-icon { background: var(--g500); }\n\n/* \u2500\u2500 PILLS DE ESTADO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-status {\n  display: inline-flex; align-items: center;\n  padding: 3px 10px; border-radius: 999px;\n  font-size: var(--fs-3xs); font-weight: 700; line-height: 1.45; white-space: nowrap;\n  background: var(--pill-neutral-bg); color: var(--pill-neutral-fg);\n}\n.gdp-status--success { background: var(--pill-success-bg); color: var(--pill-success-fg); }\n.gdp-status--warn    { background: var(--pill-warn-bg);    color: var(--pill-warn-fg); }\n.gdp-status--info    { background: var(--pill-info-bg);    color: var(--pill-info-fg); }\n\n/* \u2500\u2500 BARRA DE ANUNCIO \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-announcement {\n  background: var(--g700); height: 32px;\n  display: flex; align-items: center; overflow: hidden;\n}\n.gdp-announcement .ann-item {\n  display: flex; align-items: center; gap: var(--sp-48); padding-right: var(--sp-48);\n  font-size: var(--fs-xs); font-weight: 500; letter-spacing: .1em;\n  text-transform: uppercase; color: var(--g100); flex-shrink: 0;\n}\n\n/* \u2500\u2500 ACCI\u00d3N FLOTANTE MOBILE \u2014 siempre en barra blanca inferior \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-mobile-bar {\n  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;\n  background: var(--white); border-top: 1px solid var(--g100);\n  padding: var(--sp-12) var(--gap);\n}\n.gdp-mobile-bar .btn { width: 100%; }\n\n/* \u2500\u2500 DIVISOR \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.gdp-divider { height: 1px; background: var(--g100); border: none; }\n\n/* \u2500\u2500 Planificador de newsletters \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nbody { background: var(--white); color: var(--black); }\n.pl-in { max-width: 1400px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); }\n\n/* Cabecera */\n.pl-top { border-bottom: 1px solid var(--g100); background: var(--white); }\n.pl-top-in { max-width: 1400px; margin: 0 auto; padding: var(--sp-20) clamp(16px, 3vw, 40px);\n  display: flex; align-items: center; gap: var(--sp-24); flex-wrap: wrap; }\n.pl-logo { width: auto; height: 34px; flex: 0 0 auto; }\n.pl-top-t h1 { font-size: var(--fs-2xl); font-weight: 900; text-transform: uppercase;\n  letter-spacing: -.03em; line-height: 1; }\n.pl-top-t .label { margin-bottom: 3px; }\n.pl-top-acts { margin-left: auto; display: flex; gap: var(--sp-8); align-items: center; flex-wrap: wrap; }\n\n/* KPIs */\n.pl-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-12);\n  max-width: 1400px; margin: var(--sp-24) auto 0; padding: 0 clamp(16px, 3vw, 40px); }\n.pl-kpi { border: 1px solid var(--g100); border-radius: var(--radius); padding: var(--sp-16); }\n.pl-kpi b { display: block; font-size: var(--fs-4xl); font-weight: 900; letter-spacing: -.04em;\n  line-height: 1; font-variant-numeric: tabular-nums; }\n.pl-kpi span { display: block; margin-top: var(--sp-8); font-size: var(--fs-2xs); color: var(--g500);\n  text-transform: uppercase; letter-spacing: .08em; line-height: 1.4; }\n\n/* Barra de filtros */\n.pl-bar { position: sticky; top: 0; z-index: 10; background: var(--white);\n  border-bottom: 1px solid var(--g100); margin-top: var(--sp-24); }\n.pl-bar-in { max-width: 1400px; margin: 0 auto; padding: var(--sp-12) clamp(16px, 3vw, 40px);\n  display: flex; gap: var(--sp-8); align-items: center; flex-wrap: wrap; }\n.pl-bar select, .pl-bar input[type=\"text\"] { height: var(--ctrl-h-sm); border: 1px solid var(--g400);\n  border-radius: var(--radius); padding: 0 var(--sp-12); font-family: inherit; font-size: var(--fs-base);\n  background: var(--white); color: var(--black); }\n.pl-bar input[type=\"text\"] { min-width: 220px; flex: 1 1 220px; max-width: 340px; }\n.pl-bar select:focus-visible, .pl-bar input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }\n\n/* Bot\u00f3n apagado que sigue respondiendo, para poder explicar por qu\u00e9 no funciona.\n   La hoja de marca anula los eventos en [aria-disabled]; aqu\u00ed se recuperan. */\n.btn.pl-off[aria-disabled=\"true\"] { opacity: .45; cursor: not-allowed; pointer-events: auto; }\n.btn.pl-off[aria-disabled=\"true\"]:hover { box-shadow: none; }\n\n.pl-check { display: inline-flex; align-items: center; gap: var(--sp-8); font-size: var(--fs-base);\n  color: var(--g600); white-space: nowrap; cursor: pointer; }\n.pl-check input { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }\n.pl-check input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }\n\n.pl-sucio { margin-left: auto; font-size: var(--fs-2xs); font-weight: 700; text-transform: uppercase;\n  letter-spacing: .08em; color: var(--g500); padding: var(--sp-4) var(--sp-8);\n  border: 1px solid var(--g100); border-radius: var(--radius); white-space: nowrap; }\n.pl-sucio--si { color: var(--red); border-color: var(--red); background: var(--red-10); }\n.pl-sucio--ro { color: var(--g600); background: var(--g50); }\n\n/* Panel de planificaci\u00f3n autom\u00e1tica */\n.pl-plan { border-bottom: 1px solid var(--g100); background: var(--g50); }\n.pl-plan-in { max-width: 1400px; margin: 0 auto; padding: var(--sp-24) clamp(16px, 3vw, 40px); }\n.pl-plan-t h2 { font-size: var(--fs-2xl); font-weight: 900; text-transform: uppercase;\n  letter-spacing: -.03em; line-height: 1.1; }\n.pl-plan-t .label { margin-bottom: 3px; }\n.pl-plan-d { max-width: 74ch; margin-top: var(--sp-8); font-size: var(--fs-base);\n  color: var(--g600); line-height: 1.6; }\n.pl-plan-c { display: flex; flex-wrap: wrap; gap: var(--sp-12); align-items: flex-end;\n  margin-top: var(--sp-20); }\n.pl-plan-l { display: flex; flex-direction: column; gap: var(--sp-4);\n  font-size: var(--fs-2xs); color: var(--g500); text-transform: uppercase; letter-spacing: .08em; }\n.pl-plan-l select { height: var(--ctrl-h); border: 1px solid var(--g400); border-radius: var(--radius);\n  padding: 0 var(--sp-12); font-family: inherit; font-size: var(--fs-md); font-weight: 500;\n  background: var(--white); color: var(--black); text-transform: none; letter-spacing: 0; }\n.pl-plan-l select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }\n.pl-plan-p { margin-top: var(--sp-12); font-size: var(--fs-3xs); color: var(--g600); line-height: 1.6; }\n\n.pl-tag--ojo { color: var(--red); border-color: var(--red); background: var(--red-10); cursor: help; }\n\n#avisos { max-width: 1400px; margin: var(--sp-16) auto 0; padding: 0 clamp(16px, 3vw, 40px); }\n#avisos .gdp-alert-msg .btn { margin-left: var(--sp-8); }\n\n/* Mes */\n.pl-mes { max-width: 1400px; margin: 0 auto; padding: var(--sp-32) clamp(16px, 3vw, 40px) 0; }\n.pl-mes-head { display: flex; align-items: baseline; gap: var(--sp-12);\n  border-bottom: 2px solid var(--black); padding-bottom: var(--sp-8); }\n.pl-mes-t { font-size: var(--fs-2xl); font-weight: 900; text-transform: uppercase;\n  letter-spacing: -.03em; line-height: 1; }\n.pl-mes-t em { font-style: normal; font-weight: 400; color: var(--g500); letter-spacing: 0; }\n.pl-mes-n { margin-left: auto; font-size: var(--fs-2xs); color: var(--g500);\n  text-transform: uppercase; letter-spacing: .08em; font-variant-numeric: tabular-nums; }\n\n/* Tabla */\ntable.pl-t { width: 100%; border-collapse: collapse; table-layout: fixed;\n  user-select: none; -webkit-user-select: none; }\ntable.pl-t .pl-edit, table.pl-t input, table.pl-t .pl-razon {\n  user-select: text; -webkit-user-select: text; }\ntable.pl-t th { text-align: left; font-size: var(--fs-2xs); font-weight: 700; color: var(--g500);\n  text-transform: uppercase; letter-spacing: .1em; padding: var(--sp-12) var(--sp-8);\n  border-bottom: 1px solid var(--g100); }\ntable.pl-t td { padding: var(--sp-12) var(--sp-8); border-bottom: 1px solid var(--g100);\n  vertical-align: top; }\ntable.pl-t tbody tr:hover { background: var(--g50); }\n.c-g { width: 34px; } .c-f { width: 148px; } .c-u { width: 30%; }\n.c-e { width: 148px; } .c-x { width: 44px; }\n\n/* Asa de arrastre. Las fechas son huecos fijos del calendario: al mover un env\u00edo\n   los dem\u00e1s se recolocan en la secuencia, no se inventan fechas nuevas. */\n.pl-oculto { position: absolute; width: 1px; height: 1px; overflow: hidden;\n  clip-path: inset(50%); white-space: nowrap; }\n.pl-asa { touch-action: none; user-select: none; -webkit-user-select: none; width: 26px; height: 30px; border: 1px solid transparent; border-radius: var(--radius);\n  color: var(--g400); font-size: var(--fs-md); line-height: 1; background: var(--white);\n  cursor: grab; display: flex; align-items: center; justify-content: center; }\n.pl-asa:hover { border-color: var(--g400); color: var(--blue); background: var(--white); }\n.pl-asa:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }\n.pl-asa:active { cursor: grabbing; }\n.pl-asa:disabled { opacity: .3; cursor: not-allowed; }\n\nbody.pl-moviendo { cursor: grabbing; }\nbody.pl-moviendo * { user-select: none !important; -webkit-user-select: none !important; }\nbody.pl-moviendo .pl-edit { cursor: grabbing; }\ntr.pl-arrastrando td { opacity: .4; }\ntr.pl-antes td { box-shadow: inset 0 2px 0 0 var(--blue); }\ntr.pl-despues td { box-shadow: inset 0 -2px 0 0 var(--blue); }\ntr.pl-recien td { animation: pl-flash 1.4s ease-out; }\n@keyframes pl-flash { from { background: var(--blue-10); } to { background: transparent; } }\n@media (prefers-reduced-motion: reduce) {\n  tr.pl-recien td { animation: none; box-shadow: inset 0 0 0 999px var(--blue-10); }\n}\n\n.c-f input[type=\"date\"] { width: 100%; height: var(--ctrl-h-sm); border: 1px solid var(--g400);\n  border-radius: var(--radius); padding: 0 var(--sp-8); font-family: inherit; font-size: var(--fs-base);\n  font-variant-numeric: tabular-nums; background: var(--white); color: var(--black); }\n.c-f em { display: block; margin-top: var(--sp-4); font-style: normal; font-size: var(--fs-2xs);\n  color: var(--g500); text-transform: uppercase; letter-spacing: .06em; }\n\n.pl-edit { min-height: var(--ctrl-h-sm); border: 1px solid transparent; border-radius: var(--radius);\n  padding: var(--sp-8); font-size: var(--fs-md); font-weight: 600; line-height: 1.4;\n  cursor: text; word-break: break-word; }\n.pl-edit:hover { border-color: var(--g100); background: var(--white); }\n.pl-edit:focus { outline: none; border-color: var(--blue); background: var(--white);\n  box-shadow: 0 0 0 3px var(--blue-10); }\n.pl-razon { display: block; padding: 0 var(--sp-8); margin-top: var(--sp-4);\n  font-size: var(--fs-2xs); color: var(--g500); line-height: 1.55; }\n.pl-tag { display: inline-block; margin: var(--sp-4) 0 0 var(--sp-8); font-size: var(--fs-2xs);\n  font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--g600);\n  background: var(--g50); border: 1px solid var(--g100); border-radius: 4px; padding: 2px 6px; }\n\n.c-u input { width: 100%; height: var(--ctrl-h-sm); border: 1px solid var(--g400);\n  border-radius: var(--radius); padding: 0 var(--sp-8); font-family: inherit; font-size: var(--fs-3xs);\n  background: var(--white); color: var(--black); }\n.c-u input::placeholder { color: var(--g500); }\n.pl-abrir { display: inline-block; margin-top: var(--sp-4); pad /* ── Planificador de newsletters · García de Pou ───────────────────────────
   La página se reescribe a sí misma: al guardar, documento(ESTADO) devuelve
   el documento completo con los datos incrustados y se publica como nueva
   versión. Por eso todas las funciones son declaraciones de primer nivel:
   codigoFuente() las serializa con toString().
   ──────────────────────────────────────────────────────────────────────── */

const ESTADOS = [
  ['idea',          'Idea'],
  ['propuesta',     'Propuesta'],
  ['en-aprobacion', 'En aprobación'],
  ['aprobada',      'Aprobada'],
  ['en-diseno',     'En diseño'],
  ['montada',       'Montada'],
  ['enviada',       'Enviada'],
];
const MESES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto',
               'Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

let FILTROS = { mes: 'todos', estado: 'todos', texto: '', razon: true };
let SUCIO = false;
let SOLO_LECTURA = false;
let PUEDE_DESCARGAR = false;
let ANTERIOR = null;      // instantánea para deshacer, un nivel
let MOVIENDO = null;      // {id, destino, antes} mientras se arrastra
let SCROLL = null;        // temporizador del scroll automático al llegar al borde

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function nuevoId() {
  return 'e' + Math.random().toString(36).slice(2, 9);
}

function fechaLarga(iso) {
  const p = iso.split('-');
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  return DIAS[d.getDay()];
}

function ordenar() {
  ESTADO.envios.sort(function (a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0; });
}

function hayFiltro() {
  return FILTROS.mes !== 'todos' || FILTROS.estado !== 'todos' || FILTROS.texto.trim() !== '';
}

function instantanea() {
  ANTERIOR = JSON.parse(JSON.stringify(ESTADO.envios));
}

function deshacer() {
  if (!ANTERIOR) return;
  ESTADO.envios = ANTERIOR;
  ANTERIOR = null;
  marcarSucio(true);
  pintar();
  document.getElementById('avisos').innerHTML = '';
}

function indiceDe(id) {
  for (let i = 0; i < ESTADO.envios.length; i++) {
    if (ESTADO.envios[i].id === id) return i;
  }
  return -1;
}

function reasignarHuecos() {
  // Las fechas son huecos fijos del calendario: se vuelven a repartir en orden.
  const huecos = ESTADO.envios.map(function (e) { return e.fecha; }).sort();
  ESTADO.envios.forEach(function (e, i) { e.fecha = huecos[i]; });
}

function mover(id, destino) {
  // destino = índice donde debe quedar el envío, en la lista completa ya ordenada
  ordenar();
  const desde = indiceDe(id);
  if (desde === -1) return 0;
  let hasta = Math.max(0, Math.min(ESTADO.envios.length - 1, destino));
  if (hasta === desde) return 0;
  instantanea();
  const e = ESTADO.envios.splice(desde, 1)[0];
  ESTADO.envios.splice(hasta, 0, e);
  reasignarHuecos();
  return Math.abs(hasta - desde);
}

function tras(saltos, id) {
  if (!saltos) return;
  marcarSucio(true);
  pintar();
  const e = ESTADO.envios[indiceDe(id)];
  const p = e.fecha.split('-');
  const n = Math.abs(saltos);
  aviso('«' + e.tema.slice(0, 48) + '» pasa al ' + (+p[2]) + ' de ' + MESES[+p[1]].toLowerCase()
        + '. Se han recolocado ' + n + (n === 1 ? ' envío más.' : ' envíos más.'),
        'ok', { texto: 'Deshacer', fn: deshacer });
  const fila = document.querySelector('tr[data-id="' + id + '"]');
  if (fila) {
    fila.classList.add('pl-recien');
    fila.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
}

function moverUno(id, delta) {
  if (SOLO_LECTURA) return;
  ordenar();
  const saltos = mover(id, indiceDe(id) + delta);
  tras(saltos, id);
}

function filtrados() {
  const t = FILTROS.texto.trim().toLowerCase();
  return ESTADO.envios.filter(function (e) {
    if (FILTROS.mes !== 'todos' && e.fecha.slice(5, 7) !== FILTROS.mes) return false;
    if (FILTROS.estado !== 'todos' && e.estado !== FILTROS.estado) return false;
    if (t && (e.tema + ' ' + (e.url || '') + ' ' + (e.razon || '')).toLowerCase().indexOf(t) === -1) return false;
    return true;
  });
}

function opcionesEstado(sel) {
  return ESTADOS.map(function (x) {
    return '<option value="' + x[0] + '"' + (x[0] === sel ? ' selected' : '') + '>' + x[1] + '</option>';
  }).join('');
}

function pintarKpis() {
  const n = ESTADO.envios.length;
  const propia = ESTADO.envios.filter(function (e) { return e.propia; }).length;
  const conUrl = ESTADO.envios.filter(function (e) { return e.url; }).length;
  const porEstado = {};
  ESTADO.envios.forEach(function (e) { porEstado[e.estado] = (porEstado[e.estado] || 0) + 1; });
  const avance = ESTADO.envios.filter(function (e) {
    return ['aprobada', 'en-diseno', 'montada', 'enviada'].indexOf(e.estado) > -1;
  }).length;
  const kpis = [
    [n, 'envíos en el plan'],
    [n ? Math.round(propia / n * 100) + '%' : '—', 'papel y cartón propio'],
    [conUrl + ' / ' + n, 'con URL de referencia'],
    [avance + ' / ' + n, 'aprobados o más'],
  ];
  document.getElementById('kpis').innerHTML = kpis.map(function (k) {
    return '<div class="pl-kpi"><b>' + k[0] + '</b><span>' + k[1] + '</span></div>';
  }).join('');
}

function pintar() {
  ordenar();
  pintarKpis();
  const filtrado = hayFiltro();
  const lista = filtrados();
  const cont = document.getElementById('tabla');
  if (!lista.length) {
    cont.innerHTML = '<p class="pl-vacio">Ningún envío coincide con el filtro.</p>';
    return;
  }
  let html = '', mesPrevio = null;
  lista.forEach(function (e) {
    const mes = e.fecha.slice(0, 7);
    if (mes !== mesPrevio) {
      if (mesPrevio !== null) html += '</tbody></table></section>';
      const nMes = lista.filter(function (x) { return x.fecha.slice(0, 7) === mes; }).length;
      html += '<section class="pl-mes"><div class="pl-mes-head">'
        + '<h2 class="pl-mes-t">' + MESES[+mes.slice(5, 7)] + ' <em>' + mes.slice(0, 4) + '</em></h2>'
        + '<span class="pl-mes-n">' + nMes + (nMes === 1 ? ' envío' : ' envíos') + '</span></div>'
        + '<table class="pl-t"><thead><tr>'
        + '<th class="c-g"><span class="pl-oculto">Mover</span></th>'
        + '<th class="c-f">Fecha</th><th class="c-t">Tema</th><th class="c-u">URL</th>'
        + '<th class="c-e">Estado</th><th class="c-x"></th></tr></thead><tbody>';
      mesPrevio = mes;
    }
    const mover_ok = !SOLO_LECTURA && !filtrado;
    html += '<tr data-id="' + e.id + '">'
      + '<td class="c-g"><button class="pl-asa"' + (mover_ok ? '' : ' disabled')
      + ' aria-label="Mover el envío del ' + esc(e.fecha)
      + '. Alt y flecha arriba o abajo para cambiarlo de hueco."'
      + ' title="' + (mover_ok ? 'Arrastrar para cambiar de hueco · Alt+↑ / Alt+↓'
                               : 'Quita el filtro para poder mover envíos') + '">'
      + '<span aria-hidden="true">⠿</span></button></td>'
      + '<td class="c-f"><input type="date" data-campo="fecha" value="' + esc(e.fecha) + '" aria-label="Fecha del envío">'
      + '<em>' + fechaLarga(e.fecha) + ' · 15:00</em></td>'
      + '<td class="c-t"><div class="pl-edit" contenteditable="plaintext-only" data-campo="tema" '
      + 'role="textbox" aria-label="Tema">' + esc(e.tema) + '</div>'
      + (e.razon && FILTROS.razon ? '<span class="pl-razon">' + esc(e.razon) + '</span>' : '')
      + (e.aviso ? '<span class="pl-tag pl-tag--ojo" title="' + esc(e.aviso)
                   + '">ya hay algo parecido</span>' : '')
      + (e.propia ? '' : '<span class="pl-tag">no es fabricación propia</span>')
      + '</td>'
      + '<td class="c-u"><input type="text" data-campo="url" value="' + esc(e.url || '') + '" '
      + 'placeholder="Sin URL — pegar aquí" aria-label="URL de categoría">'
      + (e.url ? '<a class="pl-abrir" href="' + esc(e.url) + '" target="_blank" rel="noopener">abrir ↗</a>' : '')
      + '</td>'
      + '<td class="c-e" data-estado="' + e.estado + '"><select data-campo="estado" '
      + 'aria-label="Estado">' + opcionesEstado(e.estado) + '</select></td>'
      + '<td class="c-x"><button class="pl-borrar" data-accion="borrar" title="Quitar este envío" '
      + 'aria-label="Quitar el envío del ' + esc(e.fecha) + '">×</button></td>'
      + '</tr>';
  });
  html += '</tbody></table></section>';
  cont.innerHTML = html;
}

function marcarSucio(si) {
  SUCIO = si;
  const b = document.getElementById('btn-guardar');
  const s = document.getElementById('sucio');
  if (SOLO_LECTURA) {
    s.textContent = 'Solo lectura \u00b7 los cambios no se guardan';
    s.className = 'pl-sucio pl-sucio--ro';
    return;
  }
  s.textContent = si ? 'Cambios sin guardar' : 'Todo guardado';
  s.className = 'pl-sucio' + (si ? ' pl-sucio--si' : '');
  b.disabled = !si;
}

function buscaEnvio(id) {
  return ESTADO.envios.filter(function (e) { return e.id === id; })[0];
}

function alEditar(ev) {
  const campo = ev.target.getAttribute && ev.target.getAttribute('data-campo');
  if (!campo) return;
  const fila = ev.target.closest('tr');
  if (!fila) return;
  const e = buscaEnvio(fila.getAttribute('data-id'));
  if (!e) return;
  if (campo === 'tema') {
    e.tema = ev.target.textContent.replace(/\s+/g, ' ').trim();
  } else if (campo === 'url') {
    e.url = ev.target.value.trim() || null;
  } else if (campo === 'fecha') {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ev.target.value)) return;
    e.fecha = ev.target.value;
    marcarSucio(true);
    pintar();
    return;
  } else if (campo === 'estado') {
    e.estado = ev.target.value;
    marcarSucio(true);
    pintar();
    return;
  }
  marcarSucio(true);
}

function alPulsar(ev) {
  const b = ev.target.closest('button[data-accion]');
  if (!b) return;
  const fila = b.closest('tr');
  const id = fila.getAttribute('data-id');
  const e = buscaEnvio(id);
  if (b.getAttribute('data-accion') === 'borrar') {
    if (!confirm('¿Quitar el envío «' + e.tema.slice(0, 60) + '»?')) return;
    instantanea();
    ESTADO.envios = ESTADO.envios.filter(function (x) { return x.id !== id; });
    marcarSucio(true);
    pintar();
    aviso('Quitado «' + e.tema.slice(0, 48) + '».', 'warn', { texto: 'Deshacer', fn: deshacer });
  }
}

function limpiaSeleccion() {
  const sel = window.getSelection ? window.getSelection() : null;
  if (sel && sel.removeAllRanges) { try { sel.removeAllRanges(); } catch (err) {} }
}

function limpiaMarcas() {
  const t = document.getElementById('tabla');
  ['pl-arrastrando', 'pl-antes', 'pl-despues'].forEach(function (c) {
    t.querySelectorAll('.' + c).forEach(function (el) { el.classList.remove(c); });
  });
}

/* Mover envíos con eventos de puntero, no con HTML5 drag-and-drop: así funciona
   igual con ratón y con dedo, y no se pelea con los campos editables de la fila. */

function marcaDestino() {
  limpiaMarcas();
  if (!MOVIENDO) return;
  const orig = document.querySelector('tr[data-id="' + MOVIENDO.id + '"]');
  if (orig) orig.classList.add('pl-arrastrando');
  if (!MOVIENDO.destino) return;
  const fila = document.querySelector('tr[data-id="' + MOVIENDO.destino + '"]');
  if (fila) fila.classList.add(MOVIENDO.antes ? 'pl-antes' : 'pl-despues');
}

function autoScroll(y) {
  // Con 104 filas hay que poder arrastrar más allá de lo que se ve.
  const margen = 90;
  const paso = y < margen ? -14 : (y > window.innerHeight - margen ? 14 : 0);
  if (!paso) {
    if (SCROLL) { clearInterval(SCROLL); SCROLL = null; }
    return;
  }
  if (SCROLL) return;
  SCROLL = setInterval(function () {
    window.scrollBy({ top: paso, behavior: 'instant' });
  }, 16);
}

function alPunteroAbajo(ev) {
  const asa = ev.target.closest('.pl-asa');
  if (!asa || asa.disabled) return;
  if (SOLO_LECTURA || hayFiltro()) return;
  ev.preventDefault();
  const fila = asa.closest('tr');
  MOVIENDO = { id: fila.getAttribute('data-id'), destino: null, antes: true };
  document.body.classList.add('pl-moviendo');
  limpiaSeleccion();
  try { asa.setPointerCapture(ev.pointerId); } catch (err) {}
  asa.addEventListener('pointermove', alPunteroMueve);
  asa.addEventListener('pointerup', alPunteroArriba);
  asa.addEventListener('pointercancel', alPunteroFin);
  marcaDestino();
}

function alPunteroMueve(ev) {
  if (!MOVIENDO) return;
  ev.preventDefault();
  limpiaSeleccion();
  autoScroll(ev.clientY);
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const fila = el && el.closest ? el.closest('tr[data-id]') : null;
  if (!fila || fila.getAttribute('data-id') === MOVIENDO.id) {
    MOVIENDO.destino = null;
  } else {
    const caja = fila.getBoundingClientRect();
    MOVIENDO.antes = (ev.clientY - caja.top) < caja.height / 2;
    MOVIENDO.destino = fila.getAttribute('data-id');
  }
  marcaDestino();
}

function alPunteroArriba(ev) {
  if (!MOVIENDO) return;
  const m = MOVIENDO;
  alPunteroFin(ev);
  if (!m.destino) return;
  ordenar();
  const iOrigen = indiceDe(m.id);
  let iDestino = indiceDe(m.destino);
  if (!m.antes) iDestino = iDestino + 1;
  if (iOrigen < iDestino) iDestino = iDestino - 1;
  tras(mover(m.id, iDestino), m.id);
}

function alPunteroFin(ev) {
  const asa = ev && ev.currentTarget;
  if (asa && asa.removeEventListener) {
    asa.removeEventListener('pointermove', alPunteroMueve);
    asa.removeEventListener('pointerup', alPunteroArriba);
    asa.removeEventListener('pointercancel', alPunteroFin);
  }
  if (SCROLL) { clearInterval(SCROLL); SCROLL = null; }
  document.body.classList.remove('pl-moviendo');
  limpiaSeleccion();
  limpiaMarcas();
  MOVIENDO = null;
}

function alTeclaAsa(ev) {
  const asa = ev.target.closest('.pl-asa');
  if (!asa) return;
  const id = asa.closest('tr').getAttribute('data-id');
  if (ev.key === 'ArrowUp' && ev.altKey) { ev.preventDefault(); moverUno(id, -1); reenfocar(id); }
  if (ev.key === 'ArrowDown' && ev.altKey) { ev.preventDefault(); moverUno(id, 1); reenfocar(id); }
}

function reenfocar(id) {
  const asa = document.querySelector('tr[data-id="' + id + '"] .pl-asa');
  if (asa) asa.focus();
}

  const p = ult.split('-');

    + String(d.getDate()).padStart(2, '0');

                       estado: 'idea', propia: true, razon: '', cliente: '' });

  document.getElementById('f-mes').value = 'todos';
  marcarSucio(true);

  const filas = document.querySelectorAll('#tabla tr');

function aviso(texto, tipo, accion) {
  const c = document.getElementById('avisos');
  const clase = tipo === 'error' ? 'gdp-alert--error' : tipo === 'ok' ? 'gdp-alert--success'
    : tipo === 'warn' ? 'gdp-alert--warning' : 'gdp-alert--info';
  c.innerHTML = '<div class="gdp-alert ' + clase + '" role="status">'
    + '<div class="gdp-alert-icon"></div><div class="gdp-alert-content">'
    + '<p class="gdp-alert-msg">' + esc(texto)
    + (accion ? ' <button class="btn btn-outline-blue btn-sm" id="btn-accion">'
                + esc(accion.texto) + '</button>' : '')
    + '</p></div></div>';
  if (accion) document.getElementById('btn-accion').onclick = accion.fn;
  c.scrollIntoView({ block: 'nearest' });
}

function desactivar(id, motivo) {
  const b = document.getElementById(id);
  if (!b) return;
  b.classList.add('pl-off');
  b.setAttribute('aria-disabled', 'true');
  b.setAttribute('title', motivo);
  b.setAttribute('data-motivo', motivo);
  b.disabled = false;
}

function apagado(b) {
  if (!b || !b.classList.contains('pl-off')) return false;
  aviso(b.getAttribute('data-motivo'), 'warn');
  return true;
}

      + 'pero los cambios se quedan en tu pantalla y no modifican el plan.';
  }
  marcarSucio(SUCIO);
  pintar();   // repinta para que las asas de mover queden deshabilitadas de verdad

async function guardar() {
  if (apagado(document.getElementById('btn-guardar'))) return;
  if (SOLO_LECTURA) return;
  const api = window.claude && window.claude.use ? await window.claude.use('artifact') : null;
  if (!api) {
    modoLectura();
    aviso('Esta vista no puede guardar. Puedes editar y exportar, pero los cambios no se conservan.', 'warn');
    return;
  }
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  ESTADO.rev = (ESTADO.rev || 0) + 1;
  ESTADO.guardado = new Date().toISOString();
  try { sessionStorage.setItem('gdp-plan-borrador', JSON.stringify(ESTADO)); } catch (err) {}
  try {
    await api.publish(documento(ESTADO));
    // La vista se recarga con la versión nueva.
  } catch (err) {
    ESTADO.rev = ESTADO.rev - 1;
    btn.textContent = 'Guardar';
    const c = err && err.code;
    if (c === 'conflict') {
      aviso('Alguien ha guardado antes que tú. La página se está recargando con su versión.', 'warn');
      return;
    }
    if (['not_writer', 'not_granted', 'not_declared', 'consent_required',
         'capability_disabled', 'capability_removed'].indexOf(c) > -1) {
      modoLectura();
      aviso('Esta vista es de solo lectura: puedes editar y exportar, pero no guardar.', 'warn');
      return;
    }
    btn.disabled = false;
    if (c === 'too_large') { aviso('El plan es demasiado grande para guardarlo.', 'error'); return; }
    if (c === 'rate_limited') { aviso('Demasiados guardados seguidos. Espera unos segundos.', 'warn'); return; }
    aviso('No se ha podido guardar. Vuelve a intentarlo.', 'error');
  }
}

function csv() {
  const filas = [['Fecha', 'Hora', 'Dia', 'Tema', 'URL', 'Estado']];
  ESTADO.envios.forEach(function (e) {
    filas.push([e.fecha, '15:00', fechaLarga(e.fecha), e.tema, e.url || '', e.estado]);
  });
  return filas.map(function (f) {
    return f.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\r\n');
}

function brief() {
  let t = 'BRIEF DE DISEÑO · NEWSLETTERS ' + ESTADO.periodo[0].slice(0, 4) + '\n';
  t += 'García de Pou · Marketing\n';
  t += 'Envíos: martes y jueves a las 15:00 · 4 idiomas (ES, EN, FR, PT)\n';
  t += '='.repeat(78) + '\n\n';
  let mesPrevio = null;
  ESTADO.envios.forEach(function (e) {
    const mes = e.fecha.slice(0, 7);
    if (mes !== mesPrevio) {
      t += '\n' + MESES[+mes.slice(5, 7)].toUpperCase() + ' ' + mes.slice(0, 4) + '\n';
      t += '-'.repeat(78) + '\n';
      mesPrevio = mes;
    }
    const p = e.fecha.split('-');
    t += '\n' + p[2] + '/' + p[1] + '  ' + fechaLarga(e.fecha) + '\n';
    t += '  Tema:   ' + e.tema + '\n';
    t += '  URL:    ' + (e.url || '(pendiente)') + '\n';
    t += '  Estado: ' + e.estado + '\n';
    if (e.razon) t += '  Por qué: ' + e.razon + '\n';
    if (e.cliente) t += '  Cliente: ' + e.cliente + '\n';
  });
  t += '\n\n' + '='.repeat(78) + '\n';
  t += 'Los enlaces son de referencia, para saber qué producto entra en cada envío.\n';
  t += 'Los definitivos por idioma, con marcas de seguimiento, se ponen en Mailchimp.\n';
  return t;
}

async function descargar(nombre, datos, alternativa) {
  const api = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (!api) { aviso('Las descargas no están disponibles en esta vista.', 'warn'); return; }
  try {
    await api.save({ filename: nombre, data: datos });
    aviso('Descargado: ' + nombre, 'ok');
  } catch (err) {
    const c = err && err.code;
    if (c === 'declined') return;
    if (c === 'extension_not_enabled' && alternativa) { return descargar(alternativa, datos, null); }
    if (c === 'rate_limited') { aviso('Ya hay una descarga en curso. Espera un momento.', 'warn'); return; }
    aviso('No se ha podido descargar el fichero.', 'error');
  }
}

  let guardado = null;

  try { prev = JSON.parse(guardado); } catch (err) { return; }
  if (!prev || !prev.envios) return;
  if (JSON.stringify(prev.envios) === JSON.stringify(ESTADO.envios)) return;

    + '<p class="gdp-alert-msg">Puedes recuperarlos o quedarte con la versión guardada.'
    + ' <button class="btn btn-outline-blue btn-sm" id="btn-recuperar">Recuperar</button>'
    + ' <button class="btn btn-outline-blue btn-sm" id="btn-descartar">Descartar</button></p>'

}

/* ── Motor de planificación automática ────────────────────────────────────
   Mismo criterio que scripts/proponer_temas.py, portado al navegador para que
   el botón "Planificar trimestre" no dependa de ningún servidor.

   Las ideas salen del calendario comercial (DATOS.ocasiones), no del histórico:
   qué compra el hostelero en cada momento del año, con la fecha ya adelantada
   al momento de la compra. Las URL salen de DATOS.urls, que son enlaces que ya
   se han usado de verdad en newsletters anteriores: nunca se inventa una.
   ──────────────────────────────────────────────────────────────────────── */

const CUOTA_PROPIA = 0.75;
const DESCANSO_FAMILIA = 4;   // envíos que deben pasar antes de repetir familia de producto
const FECHA_MIGRACION = '2025-10-01';   // el sitio cambió de estructura de URL
const SEGMENTOS_RAROS = ['kerstmis', 'tafel-en-accessoires', 'bar-en-buffet', 'voorgerechten',
                         'disposable-products', 'wegwerpartikelen'];
const PARAMS_FILTRO = ['gpou_', 'product_list_dir', 'q='];

function dosDigitos(n) {
  return (n < 10 ? '0' : '') + n;
}

function aIso(d) {
  return d.getFullYear() + '-' + dosDigitos(d.getMonth() + 1) + '-' + dosDigitos(d.getDate());
}

function deIso(iso) {
  const p = iso.split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function huecosEntre(desde, hasta) {
  // Martes y jueves, que es la cadencia fija de envío
  const out = [];
  const d = deIso(desde);
  const fin = deIso(hasta);
  while (d <= fin) {
    const dia = d.getDay();          // 0 domingo … 2 martes … 4 jueves
    if (dia === 2 || dia === 4) out.push(aIso(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function costeUrl(u, clave) {
  const ruta = u.split('?')[0];
  const ultimo = ruta.split('/').pop().replace(/\.html$/, '');
  return [
    ultimo === clave ? 0 : 1,                                        // la clave ES la categoría
    SEGMENTOS_RAROS.some(function (s) { return u.indexOf(s) > -1; }) ? 1 : 0,
    PARAMS_FILTRO.some(function (p) { return u.indexOf(p) > -1; }) ? 1 : 0,
    (ruta.match(/\//g) || []).length,                                // categoría antes que subcategoría
    u.length,
  ];
}

function comparaCoste(a, b) {
  for (let i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return a[i] - b[i];
  }
  return 0;
}

function eligeUrl(claves) {
  // Devuelve {url, calidad} o {url: null}. Nunca inventa una URL.
  for (let i = 0; i < claves.length; i++) {
    const clave = claves[i];
    const cands = DATOS.urls.filter(function (x) { return x.u.indexOf(clave) > -1; });
    if (!cands.length) continue;
    const recientes = cands.filter(function (x) { return x.v >= FECHA_MIGRACION; });
    const pool = recientes.length ? recientes : cands;
    const antigua = recientes.length === 0;
    pool.sort(function (a, b) {
      return comparaCoste(costeUrl(a.u, clave), costeUrl(b.u, clave));
    });
    let mejor = pool[0].u;
    if (PARAMS_FILTRO.some(function (p) { return mejor.indexOf(p) > -1; })) {
      mejor = mejor.split('?')[0];
    }
    const ruta = mejor.split('?')[0];
    const exacta = ruta.split('/').pop().replace(/\.html$/, '') === clave;
    return { url: mejor, calidad: antigua ? 'antigua' : (exacta ? 'exacta' : 'proxima') };
  }
  return { url: null, calidad: null };
}

function planificar(desde, hasta) {
  const fechas = huecosEntre(desde, hasta);
  const porMes = {};
  DATOS.ocasiones.forEach(function (o, i) {
    o.meses.forEach(function (m) {
      if (!porMes[m]) porMes[m] = [];
      porMes[m].push(i);
    });
  });

  const usados = {};
  const ultimaFamilia = {};   // familia de producto -> hueco en que se usó
  const plan = [];

  function familiaDe(i) {
    // La primera clave de URL identifica la familia: servilletas, bolsas, antigrasa…
    const c = DATOS.ocasiones[i].claves;
    return c && c.length ? c[0] : 'sin-familia';
  }

  function cuotaPropia() {
    if (!plan.length) return 1;
    let n = 0;
    plan.forEach(function (p) { if (p.propia) n++; });
    return n / plan.length;
  }

  function candidatos(mes, pos) {
    const libres = (porMes[mes] || []).filter(function (i) { return !usados[i]; });
    // Orden: fabricación propia primero (regla de negocio), y después reparto de
    // familias, para no sacar tres newsletters de papel antigrasa el mismo mes.
    libres.sort(function (a, b) {
      const pa = DATOS.ocasiones[a].propia ? 0 : 1;
      const pb = DATOS.ocasiones[b].propia ? 0 : 1;
      if (pa !== pb) return pa - pb;
      const ua = ultimaFamilia[familiaDe(a)];
      const ub = ultimaFamilia[familiaDe(b)];
      const ra = ua === undefined ? 0 : (pos - ua < DESCANSO_FAMILIA ? 1 : 0);
      const rb = ub === undefined ? 0 : (pos - ub < DESCANSO_FAMILIA ? 1 : 0);
      if (ra !== rb) return ra - rb;
      const da = ua === undefined ? 999 : pos - ua;
      const db = ub === undefined ? 999 : pos - ub;
      if (da !== db) return db - da;
      return a - b;
    });
    return libres;
  }

  fechas.forEach(function (f, pos) {
    const mes = +f.slice(5, 7);
    let cands = candidatos(mes, pos);
    if (!cands.length) {
      // Si el mes se queda sin ideas, se tira de los meses vecinos
      const vecinos = [mes === 1 ? 12 : mes - 1, mes === 12 ? 1 : mes + 1];
      for (let v = 0; v < vecinos.length && !cands.length; v++) {
        cands = candidatos(vecinos[v], pos);
      }
    }
    if (!cands.length) {
      plan.push({ fecha: f, tema: '(sin propuesta — amplíe el calendario comercial)',
                  url: null, propia: false, razon: '', cliente: '' });
      return;
    }
    if (cuotaPropia() < CUOTA_PROPIA) {
      const propias = cands.filter(function (i) { return DATOS.ocasiones[i].propia; });
      if (propias.length) cands = propias;
    }
    const idx = cands[0];
    usados[idx] = true;
    ultimaFamilia[familiaDe(idx)] = pos;
    const o = DATOS.ocasiones[idx];
    const u = eligeUrl(o.claves);
    plan.push({ fecha: f, tema: o.tema, url: u.url, url_calidad: u.calidad,
                propia: o.propia, razon: o.razon, cliente: o.cliente });
  });

  return plan;
}

function trimestreDe(anyo, q) {
  const m0 = (q - 1) * 3 + 1;
  const m1 = m0 + 2;
  const ultimo = new Date(anyo, m1, 0).getDate();
  return [anyo + '-' + dosDigitos(m0) + '-01', anyo + '-' + dosDigitos(m1) + '-' + ultimo];
}

function proximoTrimestre() {
  // El siguiente al último envío que ya hay en el plan, o al de hoy si está vacío
  let ref = new Date();
  if (ESTADO.envios.length) {
    const ult = deIso(ESTADO.envios[ESTADO.envios.length - 1].fecha);
    if (ult > ref) ref = ult;
  }
  let q = Math.floor(ref.getMonth() / 3) + 2;
  let anyo = ref.getFullYear();
  if (q > 4) { q = 1; anyo = anyo + 1; }
  return { anyo: anyo, q: q };
}

function parecidoEnPlan(tema, fuera) {
  // Avisa si el tema propuesto se parece a otro que ya está en el plan
  const STOP = ('de la el los las para con en un una del al y o e su sus que se lo por mas '
                + 'todo toda todos todas').split(' ');
  function palabras(t) {
    const s = t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const out = {};
    (s.match(/[a-z]{4,}/g) || []).forEach(function (w) {
      if (STOP.indexOf(w) === -1) out[w] = true;
    });
    return Object.keys(out);
  }
  const pa = palabras(tema);
  if (!pa.length) return null;
  for (let i = 0; i < ESTADO.envios.length; i++) {
    const e = ESTADO.envios[i];
    if (e.fecha >= fuera[0] && e.fecha <= fuera[1]) continue;
    const pb = palabras(e.tema);
    if (!pb.length) continue;
    let comunes = 0;
    pa.forEach(function (w) { if (pb.indexOf(w) > -1) comunes++; });
    if (comunes / Math.min(pa.length, pb.length) >= 0.6) return e;
  }
  return null;
}

function abrePlanificador() {
  const caja = document.getElementById('planificar');
  if (caja.hasAttribute('hidden')) {
    const p = proximoTrimestre();
    document.getElementById('p-anyo').value = String(p.anyo);
    document.getElementById('p-trim').value = String(p.q);
    caja.removeAttribute('hidden');
    document.getElementById('p-trim').focus();
    pintaResumenPrevio();
  } else {
    caja.setAttribute('hidden', '');
  }
}

function pintaResumenPrevio() {
  const anyo = +document.getElementById('p-anyo').value;
  const q = +document.getElementById('p-trim').value;
  const r = trimestreDe(anyo, q);
  const huecos = huecosEntre(r[0], r[1]).length;
  const ocupados = ESTADO.envios.filter(function (e) {
    return e.fecha >= r[0] && e.fecha <= r[1];
  }).length;
  document.getElementById('p-previo').textContent =
    huecos + ' martes y jueves entre el 1 de ' + MESES[+r[0].slice(5, 7)].toLowerCase()
    + ' y el ' + (+r[1].slice(8, 10)) + ' de ' + MESES[+r[1].slice(5, 7)].toLowerCase()
    + (ocupados ? '. Ya hay ' + ocupados + (ocupados === 1 ? ' envío' : ' envíos')
                  + ' en esas fechas, que se sustituirán.' : '. No hay nada planificado ahí.');
}

function planificarTrimestre() {
  if (SOLO_LECTURA) return;
  const anyo = +document.getElementById('p-anyo').value;
  const q = +document.getElementById('p-trim').value;
  const r = trimestreDe(anyo, q);
  const previos = ESTADO.envios.filter(function (e) {
    return e.fecha >= r[0] && e.fecha <= r[1];
  });
  if (previos.length && !confirm('Se van a sustituir ' + previos.length
      + ' envíos ya planificados entre el ' + r[0] + ' y el ' + r[1] + '. ¿Seguir?')) return;

  instantanea();
  const nuevos = planificar(r[0], r[1]);
  let repetidos = 0;
  const resto = ESTADO.envios.filter(function (e) {
    return e.fecha < r[0] || e.fecha > r[1];
  });
  const anyadidos = nuevos.map(function (n, i) {
    const rep = parecidoEnPlan(n.tema, r);
    if (rep) repetidos++;
    return {
      id: 'p' + anyo + q + dosDigitos(i + 1) + Math.random().toString(36).slice(2, 5),
      fecha: n.fecha, tema: n.tema, url: n.url, estado: 'propuesta',
      propia: n.propia, razon: n.razon, cliente: n.cliente,
      aviso: rep ? 'se parece a «' + rep.tema.slice(0, 50) + '» del ' + rep.fecha : null,
    };
  });
  ESTADO.envios = resto.concat(anyadidos);

  document.getElementById('planificar').setAttribute('hidden', '');
  FILTROS.mes = 'todos';
  FILTROS.estado = 'todos';
  FILTROS.texto = '';
  document.getElementById('f-mes').value = 'todos';
  document.getElementById('f-estado').value = 'todos';
  document.getElementById('f-texto').value = '';
  marcarSucio(true);
  pintar();

  const conUrl = anyadidos.filter(function (e) { return e.url; }).length;
  const propias = anyadidos.filter(function (e) { return e.propia; }).length;
  aviso('Q' + q + ' de ' + anyo + ' planificado: ' + anyadidos.length + ' envíos, '
        + conUrl + ' con URL y ' + Math.round(propias / anyadidos.length * 100)
        + '% de papel y cartón propio.'
        + (repetidos ? ' ' + repetidos + (repetidos === 1 ? ' tema se parece' : ' temas se parecen')
                       + ' a otros del plan: están marcados.' : ''),
        'ok', { texto: 'Deshacer', fn: deshacer });

  const primera = document.querySelector('tr[data-id="' + anyadidos[0].id + '"]');
  if (primera) primera.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function documento(estado) {
  const codigo = codigoFuente(estado).replace(/<\/script/gi, '<\\/script');
  return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'

}
